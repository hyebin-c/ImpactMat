[project]
name = "impactmat"
version = "0.1.0"
description = "ImpactMat: modal-analysis based impact sound rendering from physical material parameters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "torch",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
# GPU voxelizer (requires the CUDA toolkit at install time)
cuda = ["pycuda"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["impactmat"]
include = ["impactmat/geometry/voxelize_kernel.cu"]
